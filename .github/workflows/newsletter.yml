name: Annuncio Newsletter su Discord + PDF automatico (ogni 30 minuti)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa Playwright (serve solo per generare il PDF quando c'e' una campagna nuova)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Controlla campagne Brevo inviate, annuncia su Discord e genera/carica il PDF
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID_NEWSLETTER: ${{ secrets.DISCORD_CHANNEL_ID_NEWSLETTER }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_CHANNEL_ID_USD: ${{ secrets.DISCORD_CHANNEL_ID_USD }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          JONNY_BOT_TOKEN: ${{ secrets.JONNY_BOT_TOKEN }}
          JONNY_CHAT_ID: ${{ secrets.JONNY_CHAT_ID }}
        run: python check_news.py newsletter

      - name: Salva lo stato (campagne già annunciate)
        run: |
          git config user.name "xauusd-alert-bot"
          git config user.email "actions@github.com"
          git pull --no-edit || true
          git add seen_newsletter.json || true
          git add seen_pdf_done.json || true
          git add seen_pdf_alerted.json || true
          git add seen_discord_announce_alerted.json || true
          git diff --staged --quiet || git commit -m "aggiorna stato annunci newsletter"
          git push || true

name: Pubblica su Instagram (Graph API diretta, reel/immagine schedulato)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL pubblico del video o immagine (Google Drive)"
        required: true
      cover_url:
        description: "URL pubblico della copertina (solo REELS, opzionale)"
        required: false
        default: ""
      caption:
        description: "Caption del post"
        required: true
      media_type:
        description: "Tipo di media: REELS o IMAGE"
        required: false
        default: "REELS"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pubblica su Instagram (crea container, attende FINISHED, media_publish)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          VIDEO_URL: ${{ inputs.video_url }}
          COVER_URL: ${{ inputs.cover_url }}
          CAPTION: ${{ inputs.caption }}
          MEDIA_TYPE: ${{ inputs.media_type }}
        run: python publish_instagram_reel.py

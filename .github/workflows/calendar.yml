name: Calendario News USD (ogni ora)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Esegui controllo calendario
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_CHANNEL_ID_USD: ${{ secrets.DISCORD_CHANNEL_ID_USD }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          GH_TRIGGER_TOKEN: ${{ secrets.GH_TRIGGER_TOKEN }}
        run: python check_news.py calendar

      - name: Salva lo stato (riepilogo settimanale già visto)
        run: |
          git config user.name "xauusd-alert-bot"
          git config user.email "actions@github.com"
          git pull --no-edit || true
          git add seen_weekly.json || true
          git diff --staged --quiet || git commit -m "aggiorna stato calendario"
          git push || true

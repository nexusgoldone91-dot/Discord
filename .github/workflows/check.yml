name: Controllo XAU/USD orario

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Esegui controllo
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python check_news.py

      - name: Salva lo stato (notizie già viste)
        run: |
          git config user.name "xauusd-alert-bot"
          git config user.email "actions@github.com"
          git add seen_ids.json || true
          git diff --staged --quiet || git commit -m "aggiorna stato notizie viste"
          git push || true

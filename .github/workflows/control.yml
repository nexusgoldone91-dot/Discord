name: Reparto di controllo NexusGoldOne (ogni 3 ore)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Controlla landing, Discord, Brevo, cron-job.org
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          JONNY_BOT_TOKEN: ${{ secrets.JONNY_BOT_TOKEN }}
          JONNY_CHAT_ID: ${{ secrets.JONNY_CHAT_ID }}
        run: python check_all.py

      - name: Salva lo stato
        run: |
          git config user.name "xauusd-alert-bot"
          git config user.email "actions@github.com"
          git pull --no-edit || true
          git add control_status.json || true
          git diff --staged --quiet || git commit -m "aggiorna stato controllo generale"
          git push || true

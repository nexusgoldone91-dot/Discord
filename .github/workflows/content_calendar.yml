name: Controllo calendario contenuti (ogni 5 minuti)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Controlla calendario, verifica email/Instagram pubblicati
        env:
          GCAL_CLIENT_ID: ${{ secrets.GCAL_CLIENT_ID }}
          GCAL_CLIENT_SECRET: ${{ secrets.GCAL_CLIENT_SECRET }}
          GCAL_REFRESH_TOKEN: ${{ secrets.GCAL_REFRESH_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          JONNY_BOT_TOKEN: ${{ secrets.JONNY_BOT_TOKEN }}
          JONNY_CHAT_ID: ${{ secrets.JONNY_CHAT_ID }}
        run: python check_content_calendar.py

      - name: Salva lo stato
        run: |
          git config user.name "xauusd-alert-bot"
          git config user.email "actions@github.com"
          git pull --no-edit || true
          git add seen_calendar_checks.json || true
          git diff --staged --quiet || git commit -m "aggiorna stato controllo calendario contenuti"
          git push || true

name: Controllo Landing NexusGoldOne (ogni lunedì 10:00 Canarie)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Controlla la landing page
        run: python check_landing.py

      - name: Salva lo stato (esito ultimo controllo)
        run: |
          git config user.name "xauusd-alert-bot"
          git config user.email "actions@github.com"
          git pull --no-edit || true
          git add landing_status.json || true
          git diff --staged --quiet || git commit -m "aggiorna stato controllo landing"
          git push || true

name: Security Check (una volta al giorno)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 11 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Controllo sicurezza (token, chiavi esposte, landing, permessi bot, SPF/DKIM/DMARC)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          JONNY_BOT_TOKEN: ${{ secrets.JONNY_BOT_TOKEN }}
          JONNY_CHAT_ID: ${{ secrets.JONNY_CHAT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python check_security.py
      - name: Avviso se il controllo fallisce
        if: failure()
        env:
          JONNY_BOT_TOKEN: ${{ secrets.JONNY_BOT_TOKEN }}
          JONNY_CHAT_ID: ${{ secrets.JONNY_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${JONNY_BOT_TOKEN}/sendMessage" \
            -d chat_id="${JONNY_CHAT_ID}" \
            --data-urlencode text="Jonny qui. Il controllo di sicurezza giornaliero NON e riuscito a girare. Va guardato."
